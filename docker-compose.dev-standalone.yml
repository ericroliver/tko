# Standalone dev instance - port 3001, separate from prod
services:
  tko-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tko-mcp-dev
    ports:
      - "3001:3000"
      - "9231:9229"
    volumes:
      - ./src:/app/src:ro
      - /home/eo/config/tinytask/data-dev:/data
    environment:
      TKO_MODE: http
      TKO_PORT: 3000
      TKO_HOST: 0.0.0.0
      TKO_DB_PATH: /data/tinytask-dev.db
      TKO_LOG_LEVEL: debug
      NODE_ENV: development
    command: npm run dev
    networks:
      - tko-network

networks:
  tko-network:
    driver: bridge
