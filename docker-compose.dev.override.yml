# Dev instance override - runs on port 3001 to avoid conflict with prod (3000)
services:
  tko-dev:
    ports:
      - "3001:3000"
      - "9229:9229"
    volumes:
      - ./src:/app/src:ro
      - /home/eo/config/tinytask/data-dev:/data
      - /app/node_modules
    environment:
      TKO_MODE: http
      TKO_PORT: 3000
      TKO_HOST: 0.0.0.0
      TKO_DB_PATH: /data/tinytask-dev.db
      TKO_LOG_LEVEL: debug
      NODE_ENV: development
